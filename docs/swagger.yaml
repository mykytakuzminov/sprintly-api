basePath: /api/v1
definitions:
  domain.AuthTokens:
    properties:
      access_token:
        example: <access_token>
        type: string
      refresh_token:
        example: <refresh_token>
        type: string
    type: object
  domain.Board:
    properties:
      created_at:
        example: "2025-01-15T09:00:00Z"
        type: string
      description:
        example: Planning board for Q3 product initiatives
        type: string
      id:
        example: 2af3e6a1-5c4d-4b7e-8f1a-3d9c6b2e0a85
        type: string
      name:
        example: Q3 Product Roadmap
        type: string
      owner_id:
        example: 7bc4f9d2-1a3e-4c8f-9b2d-5e7a0c4f1d63
        type: string
      updated_at:
        example: "2025-01-15T09:00:00Z"
        type: string
    type: object
  domain.ChangePasswordInput:
    properties:
      new_password:
        example: newpassword
        maxLength: 72
        minLength: 8
        type: string
      old_password:
        example: password
        maxLength: 72
        minLength: 8
        type: string
    required:
    - new_password
    - old_password
    type: object
  domain.Column:
    properties:
      board_id:
        example: 2af3e6a1-5c4d-4b7e-8f1a-3d9c6b2e0a85
        type: string
      created_at:
        example: "2025-01-15T09:00:00Z"
        type: string
      id:
        example: b3c4d5e6-f7a8-9012-bcde-f12345678901
        type: string
      name:
        example: In Progress
        type: string
      position:
        example: 2
        type: integer
      updated_at:
        example: "2025-01-15T09:00:00Z"
        type: string
    type: object
  domain.CreateBoardInput:
    properties:
      description:
        example: Planning board for Q3 product initiatives
        maxLength: 500
        type: string
      name:
        example: Q3 Product Roadmap
        maxLength: 100
        type: string
    required:
    - name
    type: object
  domain.CreateColumnInput:
    properties:
      name:
        example: In Progress
        maxLength: 100
        type: string
      position:
        example: 2
        type: integer
    required:
    - name
    - position
    type: object
  domain.CreateTaskInput:
    properties:
      assignee_id:
        example: 9ec632eb-2345-5678-90bc-def012345678
        type: string
      description:
        example: Token expiration is not handled correctly on the client side
        maxLength: 500
        type: string
      due_date:
        example: "2025-06-30T23:59:59Z"
        type: string
      name:
        example: Fix authentication bug
        maxLength: 100
        type: string
    required:
    - name
    type: object
  domain.HealthStats:
    properties:
      db:
        example: ok
        type: string
      redis:
        example: ok
        type: string
      status:
        example: ok
        type: string
      uptime:
        example: 3600
        type: integer
    type: object
  domain.LoginInput:
    properties:
      email:
        example: user@example.com
        maxLength: 254
        type: string
      password:
        example: password
        maxLength: 72
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  domain.LogoutInput:
    properties:
      refresh_token:
        example: <refresh_token>
        type: string
    required:
    - refresh_token
    type: object
  domain.RefreshInput:
    properties:
      refresh_token:
        example: <refresh_token>
        type: string
    required:
    - refresh_token
    type: object
  domain.RegisterInput:
    properties:
      email:
        example: user@example.com
        maxLength: 254
        type: string
      password:
        example: password
        maxLength: 72
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  domain.Task:
    properties:
      assignee_id:
        example: 9ec632eb-2345-5678-90bc-def012345678
        type: string
      column_id:
        example: b3c4d5e6-f7a8-9012-bcde-f12345678901
        type: string
      created_at:
        example: "2025-01-15T09:00:00Z"
        type: string
      description:
        example: Token expiration is not handled correctly on the client side
        type: string
      due_date:
        example: "2025-06-30T23:59:59Z"
        type: string
      id:
        example: c4d5e6f7-a8b9-0123-cdef-123456789012
        type: string
      name:
        example: Fix authentication bug
        type: string
      owner_id:
        example: 7bc4f9d2-1a3e-4c8f-9b2d-5e7a0c4f1d63
        type: string
      updated_at:
        example: "2025-01-15T09:00:00Z"
        type: string
    type: object
  domain.UpdateBoardInput:
    properties:
      description:
        example: Planning board for Q3 product initiatives
        maxLength: 500
        type: string
      name:
        example: Q3 Product Roadmap
        maxLength: 100
        type: string
    required:
    - name
    type: object
  domain.UpdateColumnInput:
    properties:
      name:
        example: In Progress
        maxLength: 100
        type: string
      position:
        example: 2
        type: integer
    required:
    - name
    - position
    type: object
  domain.UpdateTaskInput:
    properties:
      assignee_id:
        example: 9ec632eb-2345-5678-90bc-def012345678
        type: string
      column_id:
        example: b3c4d5e6-f7a8-9012-bcde-f12345678901
        type: string
      description:
        example: Token expiration is not handled correctly on the client side
        maxLength: 500
        type: string
      due_date:
        example: "2025-06-30T23:59:59Z"
        type: string
      name:
        example: Fix authentication bug
        maxLength: 100
        type: string
    required:
    - column_id
    - name
    type: object
  handler.ErrorResponse:
    properties:
      error:
        example: error description
        type: string
    type: object
  handler.RefreshResponse:
    properties:
      access_token:
        example: <access_token>
        type: string
    type: object
  handler.UserResponse:
    properties:
      created_at:
        example: "2025-01-15T09:00:00Z"
        type: string
      email:
        example: user@example.com
        type: string
      id:
        example: 7bc4f9d2-1a3e-4c8f-9b2d-5e7a0c4f1d63
        type: string
      role:
        example: member
        type: string
      updated_at:
        example: "2025-01-15T09:00:00Z"
        type: string
    type: object
host: 204.168.173.88:8080
info:
  contact:
    name: Mykyta Kuzminov
    url: https://github.com/mykytakuzminov
  description: |-
    REST API for managing boards, columns and tasks with JWT authentication.
    Supports token-based auth, rate limiting, pagination, sorting and filtering.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  title: Sprintly API
  version: "1.0"
paths:
  /admin/users/{id}:
    get:
      description: Returns the profile of a specific user by their ID. Requires admin
        role.
      parameters:
      - description: User ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: User data
          schema:
            $ref: '#/definitions/handler.UserResponse'
        "401":
          description: Missing or invalid access token
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: 'Forbidden: admin role required'
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get user by id
      tags:
      - admin
  /admin/users/all:
    get:
      description: Returns all users. Requires admin role. Supports pagination and
        sorting.
      parameters:
      - description: 'Number of results per page (default: 20, max: 100)'
        in: query
        name: limit
        type: integer
      - description: 'Number of results to skip (default: 0)'
        in: query
        name: offset
        type: integer
      - description: 'Field to sort by: email, created_at, updated_at (default: created_at)'
        in: query
        name: sort
        type: string
      - description: 'Sort direction: ASC or DESC (default: ASC)'
        in: query
        name: order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: List of users
          schema:
            items:
              $ref: '#/definitions/handler.UserResponse'
            type: array
        "401":
          description: Missing or invalid access token
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: 'Forbidden: admin role required'
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get all users
      tags:
      - admin
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates a user with email and password. Returns a pair of
        JWT tokens.
      parameters:
      - description: Login credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/domain.LoginInput'
      produces:
      - application/json
      responses:
        "200":
          description: Tokens issued successfully
          schema:
            $ref: '#/definitions/domain.AuthTokens'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Invalid credentials
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Login
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Invalidates the provided refresh token.
      parameters:
      - description: Refresh token to revoke
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/domain.LogoutInput'
      produces:
      - application/json
      responses:
        "204":
          description: Logged out successfully
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Logout
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Issues a new access token using a valid refresh token stored in
        Redis.
      parameters:
      - description: Refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/domain.RefreshInput'
      produces:
      - application/json
      responses:
        "200":
          description: New access token
          schema:
            $ref: '#/definitions/handler.RefreshResponse'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Refresh token not found or expired
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Refresh access token
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Creates a new user account. Email must be unique.
      parameters:
      - description: Registration data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/domain.RegisterInput'
      produces:
      - application/json
      responses:
        "201":
          description: User created successfully
          schema:
            $ref: '#/definitions/handler.UserResponse'
        "400":
          description: Invalid request body or validation error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "409":
          description: Email already in use
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Register a new user
      tags:
      - auth
  /boards:
    get:
      description: Returns all boards owned by the authenticated user. Supports pagination
        and sorting.
      parameters:
      - description: 'Number of results per page (default: 20, max: 100)'
        in: query
        name: limit
        type: integer
      - description: 'Number of results to skip (default: 0)'
        in: query
        name: offset
        type: integer
      - description: 'Field to sort by: name, created_at, updated_at (default: created_at)'
        in: query
        name: sort
        type: string
      - description: 'Sort direction: ASC or DESC (default: ASC)'
        in: query
        name: order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: List of boards
          schema:
            items:
              $ref: '#/definitions/domain.Board'
            type: array
        "401":
          description: Missing or invalid access token
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get all boards
      tags:
      - boards
    post:
      consumes:
      - application/json
      description: Creates a new board owned by the authenticated user.
      parameters:
      - description: Board data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/domain.CreateBoardInput'
      produces:
      - application/json
      responses:
        "201":
          description: Board created successfully
          schema:
            $ref: '#/definitions/domain.Board'
        "400":
          description: Invalid request body or validation error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Missing or invalid access token
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a board
      tags:
      - boards
  /boards/{boardID}/columns:
    get:
      description: Returns all columns belonging to the specified board. Supports
        pagination and sorting.
      parameters:
      - description: Board ID (UUID)
        in: path
        name: boardID
        required: true
        type: string
      - description: 'Number of results per page (default: 20, max: 100)'
        in: query
        name: limit
        type: integer
      - description: 'Number of results to skip (default: 0)'
        in: query
        name: offset
        type: integer
      - description: 'Field to sort by: name, created_at, updated_at (default: created_at)'
        in: query
        name: sort
        type: string
      - description: 'Sort direction: ASC or DESC (default: ASC)'
        in: query
        name: order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: List of columns
          schema:
            items:
              $ref: '#/definitions/domain.Column'
            type: array
        "400":
          description: Invalid board ID format
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Missing or invalid access token
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get all columns of a board
      tags:
      - columns
    post:
      consumes:
      - application/json
      description: Creates a new column inside a board. Only the board owner can add
        columns.
      parameters:
      - description: Board ID (UUID)
        in: path
        name: boardID
        required: true
        type: string
      - description: Column data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/domain.CreateColumnInput'
      produces:
      - application/json
      responses:
        "201":
          description: Column created successfully
          schema:
            $ref: '#/definitions/domain.Column'
        "400":
          description: Invalid board ID format, request body, or validation error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Missing or invalid access token
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Caller is not the board owner
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Board not found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a column
      tags:
      - columns
  /boards/{id}:
    delete:
      description: Deletes a board by ID. Only the board owner can perform this action.
      parameters:
      - description: Board ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: Board deleted successfully
        "400":
          description: Invalid board ID format
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Missing or invalid access token
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Caller is not the board owner
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Board not found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a board
      tags:
      - boards
    get:
      description: Returns a specific board by its unique identifier.
      parameters:
      - description: Board ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Board data
          schema:
            $ref: '#/definitions/domain.Board'
        "400":
          description: Invalid board ID format
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Missing or invalid access token
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Board not found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get board by ID
      tags:
      - boards
    patch:
      consumes:
      - application/json
      description: Updates the name and/or description of a board. Only the board
        owner can perform this action.
      parameters:
      - description: Board ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Updated board data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/domain.UpdateBoardInput'
      produces:
      - application/json
      responses:
        "204":
          description: Board updated successfully
        "400":
          description: Invalid board ID format or request body
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Missing or invalid access token
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Caller is not the board owner
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Board not found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update a board
      tags:
      - boards
  /columns/{columnID}/tasks:
    get:
      description: Returns all tasks belonging to the specified column. Supports pagination
        and sorting.
      parameters:
      - description: Column ID (UUID)
        in: path
        name: columnID
        required: true
        type: string
      - description: 'Number of results per page (default: 20, max: 100)'
        in: query
        name: limit
        type: integer
      - description: 'Number of results to skip (default: 0)'
        in: query
        name: offset
        type: integer
      - description: 'Field to sort by: name, due_date, created_at, updated_at (default:
          created_at)'
        in: query
        name: sort
        type: string
      - description: 'Sort direction: ASC or DESC (default: ASC)'
        in: query
        name: order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: List of tasks
          schema:
            items:
              $ref: '#/definitions/domain.Task'
            type: array
        "400":
          description: Invalid column ID format
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Missing or invalid access token
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get all tasks in a column
      tags:
      - tasks
    post:
      consumes:
      - application/json
      description: Creates a new task inside a column. Only the owner of the parent
        board can create tasks.
      parameters:
      - description: Column ID (UUID)
        in: path
        name: columnID
        required: true
        type: string
      - description: Task data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/domain.CreateTaskInput'
      produces:
      - application/json
      responses:
        "201":
          description: Task created successfully
          schema:
            $ref: '#/definitions/domain.Task'
        "400":
          description: Invalid column ID format, request body, or validation error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Missing or invalid access token
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Caller is not the board owner
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Column not found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a task
      tags:
      - tasks
  /columns/{id}:
    delete:
      description: Deletes a column by ID. Only the owner of the parent board can
        perform this action.
      parameters:
      - description: Column ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: Column deleted successfully
        "400":
          description: Invalid column ID format
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Missing or invalid access token
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Caller is not the board owner
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Column not found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a column
      tags:
      - columns
    get:
      description: Returns a specific column by its unique identifier.
      parameters:
      - description: Column ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Column data
          schema:
            $ref: '#/definitions/domain.Column'
        "400":
          description: Invalid column ID format
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Missing or invalid access token
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Column not found
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
